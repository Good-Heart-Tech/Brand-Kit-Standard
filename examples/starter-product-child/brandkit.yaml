# yaml-language-server: $schema=https://good-heart-tech.github.io/Brand-Kit-Standard/schemas/v1/brandkit.schema.json
# Reference product (child) kit. Colors marked inheritsFrom are checked against ../starter-org.
schema: ght.brandkit/v1
specVersion: 0.2.0
brand:
  id: acme-docs
  displayName: Acme Docs
  status: active
role: product
profiles:
  core: true
  identity: true
  voice: true
  visual: true
  copy: true
  tokens: true
  security: true
consumption:
  cssVariables: tokens/exports/css/variables.css
  agentDigest: digest/AGENT_CONTEXT.md
  tailwindTheme: tokens/exports/tailwind/theme.cjs
publication:
  visibility: private
  includedPaths: []
validation:
  rulesPack: "@goodheart/bkr-rules-ght"
  minContrastRatio: 4.5
  contrastPairs:
    - foreground: palette.ink
      background: palette.surface
      use: headings and body text
    - foreground: palette.onPrimary
      background: palette.primary
      use: button labels
    - foreground: palette.link
      background: palette.surface
      use: links
contacts:
  brand: docs@acme-labs.example
  legal: legal@acme-labs.example
  security: security@acme-labs.example
hierarchy:
  parent:
    repository: https://github.com/Good-Heart-Tech/Brand-Kit-Standard
    ref: main
    brandId: acme-labs
    path: ../starter-org
