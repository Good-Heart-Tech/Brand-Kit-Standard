# Word rules for Juniper Lane Studio. Read by people, AI tools, and `bkr check-copy`.
# Each entry: use (the right word), avoid (words to replace), optional topic and
# reason. caseSensitive: true is for names that must be spelled exactly.
terms:
  - use: Juniper Lane Studio
    avoid: [JLS]
    caseSensitive: true
    topic: my name
    reason: Full name first, then "Juniper Lane"; "JL" is only the logo monogram
  - use: I
    avoid: [our team, our designers]
    reason: I am one person and never pretend to be an agency
  - use: photos
    avoid: [assets]
    topic: talking to clients
  - use: final photos
    avoid: [deliverables]
    topic: talking to clients
  - use: project
    avoid: [engagement]
    topic: talking to clients
  - use: small business
    avoid: [SMB, SMBs]
  - use: starter package
    avoid: [cheap, discount]
    topic: pricing
    reason: Talk about value, not cut prices
  - use: photo shoot
    avoid: [photoshoot]
    reason: Two words
  - avoid: [synergy, leverage, brand storytelling solutions]
    reason: Agency jargon
  - avoid: [stunning, world-class, next level]
    reason: Hype words
