name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "20"
          - os: ubuntu-latest
            node: "22"
          - os: windows-latest
            node: "22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Regenerate and strictly validate every example
        run: npm run examples
      - name: Examples are committed with current exports
        shell: bash
        run: |
          if ! git diff --exit-code -- examples; then
            echo "::error::Example exports or digests are out of date. Run 'npm run examples' and commit the result."
            exit 1
          fi
      - name: Scaffold a new kit and validate it
        shell: bash
        run: |
          node packages/obks-cli/bin/obks.js init "$RUNNER_TEMP/new-kit" --brand-id ci-check --display-name "CI Check"
          node packages/obks-cli/bin/obks.js validate "$RUNNER_TEMP/new-kit"

  # Runs the reusable action from this repo against an example, so the action keeps working.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: examples/starter-product-child
          strict: "true"
